[project]
name = "argonaut-legacy"
version = "0.1.0"
description = "Argonaut Legacy — a desktop fantasy console with an in-console TPython IDE"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pygame>=2.5"]

[project.scripts]
argonaut = "argonaut.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argonaut*"]
